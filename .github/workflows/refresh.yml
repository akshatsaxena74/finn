name: Refresh data
# Weekday evenings IST (after the close, while results season filings land) + manual trigger.
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install --quiet yfinance
      - run: npm run ingest:market
      - run: npm run ingest:filings
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
      - run: npm run build:research
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
      - run: npm test
      - name: Commit if changed (Vercel redeploys on push)
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then git commit -m "data: refresh $(date -u +%F)"; git push; fi
